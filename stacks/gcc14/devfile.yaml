schemaVersion: 2.2.0
metadata:
  name: gcc14
  displayName: C++ All Toolchains
  description: GCC 14, Clang, CMake, GDB
  icon: https://raw.githubusercontent.com/LabKeepers/devspaces-devfiles/development/icons/cpp.jpg
  tags:
    - C++
    - GCC14
    - CMake
    - Clang
  projectType: cpp
  language: cpp
  version: 1.0.0
projects: 
  - name: cpp-andrzej
    git:
      remotes:
        origin: https://github.com/LabKeepers/andrzej-projects-cpp
      checkoutFrom: 
        revision: development
  - name: cpp-stan
    git:
      remotes:
        origin: https://github.com/LabKeepers/stan-projects-cpp
      checkoutFrom: 
        revision: development
attributes:
  controller.devfile.io/storage-type: per-user
components:
  - name: gcc14
    container:
      image: ghcr.io/labkeepers/devspaces-images/base-gcc14:latest
      memoryLimit: 8Gi
      cpuLimit: 4000m
      mountSources: true

commands:
  - id: install-extensions
    exec:
      component: gcc14
      commandLine: |
        code --install-extension ms-vscode.cpptools-extension-pack \
        && code --install-extension ms-vscode.cpptools-themes \
        && code --install-extension ms-vscode.cpp-devtools \
        && code --install-extension twxs.cmake \
        && code --install-extension llvm-vs-code-extensions.vscode-clangd \
        && code --install-extension jbenden.c-cpp-flylint \
        && code --install-extension ms-vscode.makefile-tools \
        && code --install-extension vadimcn.vscode-lldb \
        && code --install-extension cschlosser.doxdocgen \
        && code --install-extension streetsidesoftware.code-spell-checker \
        && code --install-extension danielpinto8zz6.c-cpp-project-generator

events:
  postStart:
    - install-extensions
